services:
  ai-tutor:
    container_name: ai-tutor
    build:
      context: .
      args:
        # Inlined into the browser bundle at build time — read from .env
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ai-tutor:latest
    restart: unless-stopped
    env_file:
      - .env
    # No `ports:` mapping — Traefik reaches the container over the internal
    # Docker network below, so this app's port 3000 never touches the host
    # and can't collide with any other container already using host port 3000.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Served via the Traefik project template already running on this VPS
    # (Hostinger Docker Manager's default Traefik: external "traefik-proxy"
    # network, "websecure" entrypoint, "letsencrypt" certresolver).
    # APP_DOMAIN defaults to a sslip.io address (wildcard DNS that resolves
    # to your VPS IP automatically, no DNS setup needed) — set the exact
    # value from your Traefik container's TRAEFIK_HOST env var in .env.
    # Swap in a real domain later by changing APP_DOMAIN and redeploying —
    # no rebuild needed, it's routing only.
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-tutor.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.ai-tutor.entrypoints=websecure"
      - "traefik.http.routers.ai-tutor.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-tutor.loadbalancer.server.port=3000"

    # --- Fallback: expose directly on a host port instead of Traefik ---
    # Only needed if this VPS's Traefik network isn't actually named
    # "traefik-proxy" (check with `docker network ls`) or you'd rather skip
    # the reverse proxy for now. Comment out the `networks:`/`labels:` block
    # above (and the top-level `networks:` section below), then uncomment:
    #
    # ports:
    #   - "${APP_PORT:-3005}:3000"

networks:
  traefik-proxy:
    external: true
