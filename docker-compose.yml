services:
  ai-tutor:
    container_name: ai-tutor
    build:
      context: .
      args:
        # Inlined into the browser bundle at build time — read from .env
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ai-tutor:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host port is configurable so it never clashes with the other apps
      # on this VPS (n8n, uptime, taipy, ...). Override with APP_PORT in .env.
      - "${APP_PORT:-3005}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # --- Optional: serve via the Traefik already running on this VPS ---
    # Uncomment and adjust to your Traefik setup (network name, certresolver,
    # entrypoint names must match your existing traefik config), then you can
    # remove the `ports:` mapping above.
    #
    # networks:
    #   - traefik
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.ai-tutor.rule=Host(`tutor.yourdomain.com`)"
    #   - "traefik.http.routers.ai-tutor.entrypoints=websecure"
    #   - "traefik.http.routers.ai-tutor.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.ai-tutor.loadbalancer.server.port=3000"

# networks:
#   traefik:
#     external: true
#     name: traefik   # `docker network ls` on the VPS to find the real name
