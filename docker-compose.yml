services:
  ai-tutor:
    container_name: ai-tutor
    build:
      context: .
      args:
        # Inlined into the browser bundle at build time — read from .env
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ai-tutor:latest
    restart: unless-stopped
    env_file:
      - .env
    # Published to localhost only (127.0.0.1), not 0.0.0.0 — never reachable
    # directly from the internet, only from Traefik. This mirrors how the
    # existing apps on this VPS are wired: Traefik runs with
    # `network_mode: host` and routes to a fixed `loadbalancer.server.url`
    # (confirmed via `docker inspect aia-flagged-automation...`, which uses
    # `http://127.0.0.1:8000`) rather than reaching into each app's own
    # bridge network. APP_PORT picks the host-loopback port for this app;
    # must not collide with another app's published port — check
    # `ss -tlnp` or `docker ps` on the VPS first (8000 is taken by aia).
    ports:
      - "127.0.0.1:${APP_PORT:-3005}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Traefik discovers this container purely from labels (Docker provider
    # has exposedbydefault=false, so traefik.enable=true is required).
    # APP_DOMAIN must be set in .env — this VPS's Traefik uses sslip.io
    # addresses in the form <label>.187-127-173-25.sslip.io (confirmed from
    # the aia-flagged-automation app's own labels), so
    # APP_DOMAIN=ai-tutor.187-127-173-25.sslip.io is the expected value.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-tutor.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.ai-tutor.entrypoints=websecure"
      - "traefik.http.routers.ai-tutor.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-tutor.loadbalancer.server.url=http://127.0.0.1:${APP_PORT:-3005}"
